<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <rect width="560" height="320" fill="url(#sky)"/>

  <!-- Cloud / platform node -->
  <g transform="translate(280 62)">
    <path d="M-46 18a22 22 0 0 1 4-43 30 30 0 0 1 56-6 22 22 0 0 1 30 25 18 18 0 0 1-6 24Z" fill="#fff" stroke="#0284C7" stroke-width="3"/>
    <rect x="-14" y="-6" width="28" height="18" rx="3" fill="none" stroke="#0A2540" stroke-width="3"/>
    <path d="M-6 18h12" stroke="#0A2540" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Connection lines -->
  <g fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M250 90 120 150"/>
    <path d="M280 92 280 140"/>
    <path d="M310 90 440 150"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="270" width="560" height="50" fill="#E2E8F0"/>
  <path d="M0 270h560" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Building left: library -->
  <g>
    <rect x="50" y="160" width="140" height="110" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="44" y="150" width="152" height="14" fill="#0A2540"/>
    <g fill="url(#glass)">
      <rect x="64" y="176" width="26" height="30" rx="2"/><rect x="107" y="176" width="26" height="30" rx="2"/><rect x="150" y="176" width="26" height="30" rx="2"/>
      <rect x="64" y="220" width="26" height="30" rx="2"/><rect x="150" y="220" width="26" height="30" rx="2"/>
    </g>
    <rect x="105" y="218" width="30" height="52" rx="2" fill="#334155"/>
    <circle cx="120" cy="150" r="10" fill="#059669" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Building center: classrooms -->
  <g>
    <rect x="215" y="140" width="130" height="130" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="209" y="132" width="142" height="12" fill="#0A2540"/>
    <g fill="url(#glass)">
      <rect x="228" y="156" width="104" height="22" rx="2"/>
      <rect x="228" y="188" width="104" height="22" rx="2"/>
    </g>
    <rect x="258" y="222" width="44" height="48" rx="2" fill="#334155"/>
    <circle cx="280" cy="140" r="10" fill="#059669" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Building right: lab -->
  <g>
    <rect x="370" y="168" width="140" height="102" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <rect x="364" y="158" width="152" height="14" fill="#0A2540"/>
    <g fill="url(#glass)">
      <rect x="384" y="184" width="112" height="26" rx="2"/>
    </g>
    <rect x="384" y="222" width="30" height="48" rx="2" fill="#334155"/>
    <rect x="424" y="230" width="20" height="26" rx="3" fill="#0A2540"/>
    <circle cx="434" cy="240" r="4" fill="#38BDF8"/>
    <circle cx="440" cy="158" r="10" fill="#D97706" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Trees -->
  <g fill="#6EE7B7">
    <circle cx="25" cy="240" r="18"/><rect x="22" y="250" width="6" height="22" fill="#78716C"/>
    <circle cx="540" cy="236" r="20"/><rect x="537" y="248" width="6" height="24" fill="#78716C"/>
  </g>
</svg>
