<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="560" height="400" fill="url(#sky)"/>

  <!-- Background building -->
  <g opacity="0.9">
    <rect x="0" y="40" width="560" height="250" fill="#F1F5F9"/>
    <g fill="url(#glass)" stroke="#CBD5E1" stroke-width="2">
      <rect x="20" y="60" width="110" height="200" rx="4"/>
      <rect x="140" y="60" width="110" height="200" rx="4"/>
      <rect x="430" y="60" width="110" height="200" rx="4"/>
    </g>
    <path d="M20 160h110M140 160h110M430 160h110M75 60v200M195 60v200M485 60v200" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="0" y="40" width="560" height="14" fill="#0A2540"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="290" width="560" height="110" fill="url(#floor)"/>
  <path d="M0 330h560M0 370h560" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Distant people silhouettes -->
  <g fill="#94A3B8" opacity="0.55">
    <circle cx="70" cy="228" r="9"/><rect x="61" y="240" width="18" height="52" rx="8"/>
    <circle cx="105" cy="236" r="8"/><rect x="97" y="246" width="16" height="46" rx="7"/>
    <circle cx="505" cy="232" r="9"/><rect x="496" y="244" width="18" height="48" rx="8"/>
  </g>

  <!-- Turnstile glass gates -->
  <g>
    <rect x="300" y="210" width="16" height="130" rx="4" fill="#334155"/>
    <path d="M316 240h90" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <rect x="316" y="225" width="110" height="70" rx="6" fill="url(#glass)" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Reader pillar -->
  <g>
    <rect x="230" y="150" width="70" height="190" rx="10" fill="#0A2540"/>
    <rect x="242" y="166" width="46" height="62" rx="6" fill="#0F172A"/>
    <rect x="246" y="170" width="38" height="54" rx="4" fill="#065F46"/>
    <path d="M256 198l7 7 13-14" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="265" cy="252" r="12" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="265" cy="252" r="4" fill="#38BDF8"/>
    <rect x="248" y="276" width="34" height="5" rx="2.5" fill="#1E3A5F"/>
  </g>

  <!-- NFC waves -->
  <g fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round">
    <path d="M214 230a26 26 0 0 0 0-40" opacity="0.9"/>
    <path d="M200 244a46 46 0 0 0 0-68" opacity="0.6"/>
    <path d="M186 258a66 66 0 0 0 0-96" opacity="0.35"/>
  </g>

  <!-- Hand + card -->
  <g transform="rotate(-12 150 215)">
    <rect x="100" y="180" width="96" height="62" rx="9" fill="url(#card)"/>
    <rect x="112" y="194" width="22" height="16" rx="3" fill="#FDE68A"/>
    <rect x="112" y="220" width="54" height="6" rx="3" fill="#BAE6FD"/>
    <path d="M178 196a10 10 0 0 1 0 14M184 192a17 17 0 0 1 0 22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <path d="M30 300c30-30 60-48 92-58l24-6c10-2 16 8 8 15l-20 16c-24 18-50 32-80 40Z" fill="#F2C9A5"/>
  <path d="M0 330c20-10 34-22 40-36l26 32c-14 14-38 26-66 32Z" fill="#1E3A5F"/>

  <!-- Status dot -->
  <circle cx="300" cy="140" r="14" fill="#059669"/>
  <path d="M294 140l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
