<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="560" height="200" fill="url(#bg)"/>

  <!-- Hallway -->
  <path d="M0 160h560" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="0" y="160" width="560" height="40" fill="#E2E8F0"/>
  <g fill="#fff" stroke="#CBD5E1" stroke-width="2">
    <rect x="30" y="30" width="90" height="130"/>
    <rect x="440" y="30" width="90" height="130"/>
  </g>
  <path d="M75 30v130M485 30v130M30 95h90M440 95h90" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Classroom door + reader -->
  <rect x="300" y="40" width="90" height="120" rx="3" fill="#0A2540"/>
  <rect x="312" y="52" width="66" height="44" rx="3" fill="#7DD3FC" opacity="0.5"/>
  <circle cx="372" cy="112" r="4" fill="#CBD5E1"/>
  <rect x="404" y="88" width="22" height="34" rx="4" fill="#0F172A"/>
  <circle cx="415" cy="100" r="5" fill="none" stroke="#34D399" stroke-width="2.5"/>
  <rect x="409" y="112" width="12" height="3" rx="1.5" fill="#34D399"/>

  <!-- Student -->
  <g>
    <circle cx="200" cy="58" r="20" fill="#C08A65"/>
    <path d="M180 52c2-16 14-22 24-20 12 2 18 10 16 22-8-6-24-8-40-2Z" fill="#1E293B"/>
    <path d="M168 160v-60c0-14 12-24 32-24s32 10 32 24v60Z" fill="#0284C7"/>
    <path d="M178 96l-8 64M222 96l8 64" stroke="#0369A1" stroke-width="3"/>
    <rect x="160" y="92" width="18" height="50" rx="8" fill="#0F172A" opacity="0.85"/>
    <!-- Arm reaching to reader -->
    <path d="M228 100c24 6 50 6 74 2" stroke="#0284C7" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="306" cy="101" r="8" fill="#C08A65"/>
  </g>

  <!-- Card + waves -->
  <g transform="rotate(-8 340 100)">
    <rect x="318" y="88" width="42" height="27" rx="4" fill="url(#card)"/>
    <rect x="323" y="94" width="10" height="7" rx="1.5" fill="#FDE68A"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round">
    <path d="M436 92a14 14 0 0 1 0 20"/>
    <path d="M444 84a26 26 0 0 1 0 36" opacity="0.6"/>
  </g>
</svg>
